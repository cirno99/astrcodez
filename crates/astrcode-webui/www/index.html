<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>astrcode</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #101014;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      /* 窗口自己画满视口，canvas 必须贴住左上角，不能被 flex 居中。 */
      body > canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot {
        position: fixed;
        z-index: 1;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        white-space: pre-wrap;
        background: #101014;
      }
    </style>
  </head>
  <body>
    <div id="boot">正在加载…</div>
    <!-- 相对引用：产物挂在哪个挂载点由服务端决定，页面不写死。 -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
