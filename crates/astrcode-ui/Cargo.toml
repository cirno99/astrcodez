[package]
name = "astrcode-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "宿主无关的 UI 层：协议客户端、会话状态与 gpui-kit 视图，由桌面 App 与 Web UI 共用"

[dependencies]
# 语言子集按「本仓库 + 常见项目」选：每个语言特性都会编译一份 C 语法库，
# 全开（`tree-sitter-languages`）会明显拖长构建与增大产物。
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
astrcode-core = { path = "../astrcode-core" }
astrcode-protocol = { path = "../astrcode-protocol" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true, features = ["io"] }
url = { workspace = true }
rustc-hash = { workspace = true }
# 语法高亮器收 `ropey::Rope`，而 gpui-component 把版本钉死在这个 beta 上；
# 只有取同一个版本，两边看到的才是同一个 `Rope` 类型。
ropey = "=2.0.0-beta.1"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
