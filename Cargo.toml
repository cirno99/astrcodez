[workspace]
resolver = "2"
default-members = ["crates/astrcode-cli"]
members = [
    "crates/astrcode-core",
    "crates/astrcode-ai",
    "crates/astrcode-storage",
    "crates/astrcode-session-projection",
    "crates/astrcode-context",
    "crates/astrcode-session",
    "crates/astrcode-extensions",
    "crates/astrcode-extension-sdk",
    "crates/astrcode-extension-session-commands",
    "crates/astrcode-extension-worker",
    "crates/astrcode-bundled-extensions",
    "crates/astrcode-server",
    "crates/astrcode-protocol",
    "crates/astrcode-client",
    "crates/astrcode-gui",
    "crates/astrcode-ui",
    "crates/astrcode-webui",
    "crates/astrcode-cli",
    "crates/astrcode-log",
    "crates/astrcode-paths",
    "crates/astrcode-s5r-runtime",
    "crates/astrcode-extension-agent-tools",
    "crates/astrcode-extension-coding",
    "crates/astrcode-extension-mcp",
    "crates/astrcode-extension-skill",
    "crates/astrcode-extension-todo-tool",
    "crates/astrcode-extension-ask-user",
    "crates/astrcode-extension-goal",
    "crates/astrcode-extension-ralph",
    "crates/astrcode-extension-memory",
    "crates/astrcode-extension-kanban",
    "crates/astrcode-extension-web-tools",
    "crates/astrcode-eval",
]

[workspace.package]
version = "0.3.16"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Base tokio: enable features per crate to avoid pulling unused subsystems.
tokio = { version = "1.52.3", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
# 内部 ID、枚举、PathBuf 等有界键的哈希；不可信且无界的字符串键仍用默认 SipHash。
rustc-hash = "2.1.3"
thiserror = "2.0.18"
async-trait = "0.1.89"
arc-swap = "1.9.1"
uuid = { version = "1.23.1", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
dirs = "6.0.0"
fs2 = "0.4.3"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
parking_lot = "0.12.5"
process-wrap = { version = "9.1.0", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
noyalib = { version = "0.0.18", features = ["compat-serde-yaml"] }
tempfile = "3.27.0"
tokio-util = "0.7.18"
regex = "1.12.3"
walkdir = "2.5.0"
toml = "1.1.4"
criterion = "0.8"
globset = "0.4.18"
ignore = "0.4.25"
# ripgrep 的库：全局搜索用它们做遍历、扫描与行匹配，版本与 ripgrep 本体一致。
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
similar = "3.1.0"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["cors"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
# 把前端构建产物编译进二进制；debug 构建也内嵌，避免 debug/release 行为分叉。
rust-embed = { version = "8.12.0", features = ["debug-embed", "mime-guess"] }
libc = "0.2.186"
getrandom = "0.3.4"
agent-client-protocol = "0.11.1"
sha2 = "0.10.9"
scraper = "0.27.0"
html2text = "0.17.1"
url = "2.5.8"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

# 全局分配器，仅供二进制 crate 在 crate root 注册；库 crate 不得引用。
# MSVC 被上游列为 UNTESTED（jemalloc-sys/src/env.rs 的 UNTESTED_TARGETS），
# 故各 bin 以 cfg(not(target_env = "msvc")) 门控，Windows 保持系统分配器。
tikv-jemallocator = "0.7.0"

# --- Profiles ---

[profile.dev]
opt-level = 0
debug = true

# Optimize dependencies in dev mode to speed up runtime without hurting
# incremental compilation of workspace crates.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
